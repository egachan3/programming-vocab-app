name: Keep Alive

# RenderのWebサービス(15分無アクセスでスリープ)と
# SupabaseのDB(7日間無アクセスでプロジェクト一時停止)を
# 定期的に叩いて起動状態を維持する
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Renderアプリにアクセスしてスリープを防ぐ
        # スリープからの復帰(コールドスタート)に50秒以上かかることがあるため長めに待つ
        run: curl -sf --max-time 90 https://programming-vocab-app.onrender.com/ > /dev/null

  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: SupabaseのDBにクエリを実行して一時停止を防ぐ
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -c "SELECT 1;"
