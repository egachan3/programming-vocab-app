<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>ページが見つかりません (404) | Programming Vocab App</title>
    <link rel="icon" href="/icon.png" type="image/png">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <style>
      /*
        エラーページ自体がレンダリングに失敗しないよう、スタイルはこのファイル内で完結させる。
        アセットパイプラインやDBに依存しないため、アプリ側で例外が起きている状況でも確実に表示できる。
        同じCSSを 400 / 404 / 422 / 500 に意図的に複製しているため、変更時は全ファイルを揃えること。
      */
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        background: #f9fafb;
        color: #1f2937;
        font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Meiryo", sans-serif;
        line-height: 1.8;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        text-align: center;
      }

      .code {
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #be123c;
        background: #ffe4e6;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
      }

      h1 {
        font-size: 1.6rem;
        font-weight: 700;
      }

      p {
        max-width: 34rem;
        color: #6b7280;
        font-size: 0.95rem;
      }

      a {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.7rem 1.75rem;
        border-radius: 9999px;
        background: #e11d48;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
        transition: background-color 0.15s ease;
      }

      a:hover { background: #be123c; }
      a:focus-visible { outline: 2px solid #be123c; outline-offset: 2px; }
    </style>
  </head>

  <body>
    <main>
      <span class="code" aria-hidden="true">404 NOT FOUND</span>
      <h1>ページが見つかりませんでした</h1>
      <p>
        お探しのページは削除されたか、URLが変更された可能性があります。
        アドレスに誤りがないかご確認ください。
      </p>
      <a href="/">トップページへ</a>
    </main>
  </body>
</html>
