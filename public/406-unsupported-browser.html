<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>お使いのブラウザには対応していません (406) | Programming Vocab App</title>
    <link rel="icon" href="/icon.png" type="image/png">
    <style>
      /*
        このページはサポート対象外の古いブラウザにしか表示されない。
        そのため flex の gap や clamp() など比較的新しいCSSは使わず、
        margin ベースの保守的な指定のみで組んでいる
        (「対応していません」と伝えるページ自体が崩れることを避けるため)。
      */
      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 4rem 1.5rem;
        background: #f9fafb;
        color: #1f2937;
        font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Meiryo", sans-serif;
        line-height: 1.8;
        text-align: center;
      }

      .code {
        display: inline-block;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #be123c;
        background: #ffe4e6;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
      }

      h1 {
        font-size: 1.6rem;
        font-weight: 700;
        margin: 1.25rem 0 1rem;
      }

      p {
        max-width: 34rem;
        margin: 0 auto 1.5rem;
        color: #6b7280;
        font-size: 0.95rem;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        color: #4b5563;
        font-size: 0.9rem;
      }

      li {
        display: inline-block;
        margin: 0 0.6rem;
      }
    </style>
  </head>

  <body>
    <main>
      <span class="code" aria-hidden="true">406 NOT ACCEPTABLE</span>
      <h1>お使いのブラウザには対応していません</h1>
      <p>
        このアプリは、比較的新しいブラウザの機能を利用しています。
        お手数ですが、以下のいずれかの最新版でアクセスしてください。
      </p>
      <p lang="en">
        This application requires a modern browser.
        Please use the latest version of one of the following.
      </p>
      <ul>
        <li>Google Chrome</li>
        <li>Safari</li>
        <li>Microsoft Edge</li>
        <li>Firefox</li>
      </ul>
    </main>
  </body>
</html>
