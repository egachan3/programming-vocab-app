<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>サーバーエラーが発生しました (500) | Programming Vocab App</title>
    <link rel="icon" href="/icon.png" type="image/png">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <style>
      /*
        エラーページ自体がレンダリングに失敗しないよう、スタイルはこのファイル内で完結させる。
        アセットパイプラインやDBに依存しないため、アプリ側で例外が起きている状況でも確実に表示できる。
        同じCSSを 400 / 404 / 422 / 500 に意図的に複製しているため、変更時は全ファイルを揃えること。
      */
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        background: #f9fafb;
        color: #1f2937;
        font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Meiryo", sans-serif;
        line-height: 1.8;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        text-align: center;
      }

      .code {
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #be123c;
        background: #ffe4e6;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
      }

      h1 {
        font-size: 1.6rem;
        font-weight: 700;
      }

      p {
        max-width: 34rem;
        color: #6b7280;
        font-size: 0.95rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
        margin-top: 0.5rem;
      }

      a {
        display: inline-block;
        padding: 0.7rem 1.75rem;
        border-radius: 9999px;
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
        transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }

      .primary { background: #e11d48; color: #fff; }
      .primary:hover { background: #be123c; }

      .secondary { border: 1px solid #9ca3af; color: #4b5563; }
      .secondary:hover { border-color: #e11d48; color: #be123c; }

      a:focus-visible { outline: 2px solid #be123c; outline-offset: 2px; }
    </style>
  </head>

  <body>
    <main>
      <span class="code" aria-hidden="true">500 SERVER ERROR</span>
      <h1>サーバーエラーが発生しました</h1>
      <p>
        一時的な問題が発生しています。お手数ですが、しばらく時間をおいてから再度お試しください。
        繰り返し発生する場合は、お問い合わせよりご連絡ください。
      </p>
      <div class="actions">
        <a class="primary" href="/">トップページへ</a>
        <a class="secondary" href="https://forms.gle/dN1yKaLNXQcWkgZJA" target="_blank" rel="noopener noreferrer">お問い合わせ</a>
      </div>
    </main>
  </body>
</html>
